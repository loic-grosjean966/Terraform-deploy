# Vérification du code OpenTofu du dépôt.
#
# - `fmt` et `validate` tournent sans contacter Prism Central ni écrire de state
#   (`init -backend=false`).
# - `plan` ne s'exécute que si les secrets Nutanix sont configurés sur le dépôt. Il nécessite un
#   accès réseau à Prism Central : sur un runner GitHub hébergé, un Prism Central privé
#   (ex. 172.20.0.200) est injoignable — utiliser un runner self-hosted dans ce cas.
#
# Aucun `apply` n'est exécuté ici : le backend est local, donc un state écrit en CI serait perdu
# à la fin du job. Un apply automatisé nécessiterait d'abord un backend distant.

name: 'OpenTofu'

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: 'Format & validate'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Tofu fmt
        run: tofu fmt -check -recursive

      # -backend=false : pas d'initialisation du backend, aucun state n'est créé.
      - name: Tofu init
        run: tofu init -backend=false -input=false

      - name: Tofu validate
        run: tofu validate -no-color

  plan:
    name: 'Plan'
    runs-on: ubuntu-latest
    needs: validate

    env:
      TF_VAR_nutanix_username: ${{ secrets.NUTANIX_USERNAME }}
      TF_VAR_nutanix_password: ${{ secrets.NUTANIX_PASSWORD }}
      TF_VAR_nutanix_endpoint: ${{ secrets.NUTANIX_ENDPOINT }}
      TF_VAR_nutanix_cluster_uuid: ${{ secrets.NUTANIX_CLUSTER_UUID }}
      TF_VAR_nutanix_image_uuid: ${{ secrets.NUTANIX_IMAGE_UUID }}
      TF_VAR_nutanix_subnet_uuid: ${{ secrets.NUTANIX_SUBNET_UUID }}
      TF_VAR_nutanix_storage_container_uuid: ${{ secrets.NUTANIX_STORAGE_CONTAINER_UUID }}

    steps:
      - name: Checkout
        if: env.TF_VAR_nutanix_endpoint != ''
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        if: env.TF_VAR_nutanix_endpoint != ''
        uses: opentofu/setup-opentofu@v1

      - name: Tofu init
        if: env.TF_VAR_nutanix_endpoint != ''
        run: tofu init -input=false

      - name: Tofu plan
        if: env.TF_VAR_nutanix_endpoint != ''
        run: tofu plan -input=false -no-color

      - name: Plan ignoré
        if: env.TF_VAR_nutanix_endpoint == ''
        run: echo "Secrets Nutanix non configurés — étape plan ignorée."
